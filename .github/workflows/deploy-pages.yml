name: Publish portfolio

on:
  push:
    branches: [main]
    paths: [portfolio-site.zip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out portfolio source
        uses: actions/checkout@v6
      - name: Extract verified static website
        run: |
          mkdir site
          unzip -q portfolio-site.zip -d site
          test -f site/index.html
          test -f site/en/work/index.html
          test -f site/ar/work/index.html
          test "$(find site/images/projects -type f | wc -l)" -ge 27
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload extracted website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
